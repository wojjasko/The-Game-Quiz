<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel Admina - Etap 3</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
        .section { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        button { padding: 10px 15px; font-weight: bold; cursor: pointer; margin: 5px; background: #45f3ff; border: none; border-radius: 4px; color: #000; }
        .btn-danger { background: #dc3545 !important; color: #fff !important; }
        .btn-success { background: #28a745 !important; color: #fff !important; }
        .btn-warning { background: #ffc107 !important; color: #000 !important; }
        .card-item-admin { border: 1px solid #444; padding: 10px; margin: 5px; display: flex; justify-content: space-between; align-items: center; border-radius: 6px; }
        .card-used { opacity: 0.4; background: #1a1a1a; }
    </style>
</head>
<body>

<h1>PANEL ADMINA - ETAP 3 (KARTY)</h1>

<div class="section">
    <h3>1. Zarządzanie Kartami na Stole (10 kart)</h3>
    <div id="adminCardsList"></div>
</div>

<div class="section" id="sectionPytanieControl" style="display: none; border: 2px solid #66fcf1;">
    <h3>2. Aktywne Pytanie: <span id="lblKategoria" style="color:#ff007f"></span></h3>
    <p style="font-size: 18px;" id="lblTrescPytania"></p>
    <p>Poprawna odpowiedź: <b id="lblPoprawna" style="color: #28a745; font-size: 20px;"></b></p>

    <div style="margin-bottom: 15px;">
        <h4>Koło Ratunkowe 50/50:</h4>
        <button class="btn-warning" onclick="uzyjKolo(1)">Użyj 50/50 (Drużyna 1)</button>
        <button class="btn-warning" onclick="uzyjKolo(2)">Użyj 50/50 (Drużyna 2)</button>
    </div>

    <div>
        <h4>Rozstrzygnięcie Odpowiedzi:</h4>
        <button class="btn-success" onclick="odpowiedz(1, true)">Drażyna 1 - POPRAWNA (+<span id="lblMnoznik1"></span> pkt)</button>
        <button class="btn-danger" onclick="odpowiedz(1, false)">Drużyna 1 - BŁĘDNA (Reset mnożnika)</button>
        <br><br>
        <button class="btn-success" onclick="odpowiedz(2, true)">Drużyna 2 - POPRAWNA (+<span id="lblMnoznik2"></span> pkt)</button>
        <button class="btn-danger" onclick="odpowiedz(2, false)">Drużyna 2 - BŁĘDNA (Reset mnożnika)</button>
        <br><br>
        <button onclick="zamknijPytanie()">Zamknij bez przyznawania punktów</button>
    </div>
</div>

<script>
    let aktualnyStan = null;

    function pobierzStan() {
        fetch('/api/etap3/stan').then(r => r.json()).then(stan => {
            aktualnyStan = stan;
            renderujAdmin();
        });
    }

    function renderujAdmin() {
        if (!aktualnyStan) return;

        // Lista kart
        const list = document.getElementById('adminCardsList');
        list.innerHTML = '';
        aktualnyStan.kartyNaStole.forEach(k => {
            const div = document.createElement('div');
            div.className = `card-item-admin ${k.zuzyta ? 'card-used' : ''}`;
            div.innerHTML = `
                <span><b>${k.kategoria}</b> ${k.zuzyta ? '(Zużyta)' : ''}</span>
                <div>
                    <button onclick="wymienKarte(${k.id})" ${k.zuzyta ? 'disabled' : ''}>Wymień kartę (Na starcie)</button>
                    <button class="btn-success" onclick="wybierzKarte(${k.id})" ${k.zuzyta ? 'disabled' : ''}>Otwórz Pytanie</button>
                </div>
            `;
            list.appendChild(div);
        });

        // Kontrola aktywnego pytania
        const secPytanie = document.getElementById('sectionPytanieControl');
        if (aktualnyStan.pokazPytanie && aktualnyStan.wybranePytanie) {
            const q = aktualnyStan.wybranePytanie;
            document.getElementById('lblKategoria').innerText = q.kategoria;
            document.getElementById('lblTrescPytania').innerText = q.trescPytania;
            document.getElementById('lblPoprawna').innerText = `${q.poprawna} (${q['odp' + q.poprawna]})`;

            document.getElementById('lblMnoznik1').innerText = aktualnyStan.mnoznikDruzyny1;
            document.getElementById('lblMnoznik2').innerText = aktualnyStan.mnoznikDruzyny2;

            secPytanie.style.display = 'block';
        } else {
            secPytanie.style.display = 'none';
        }
    }

    function wymienKarte(id) {
        fetch(`/api/etap3/wymien?idKarty=${id}`, { method: 'POST' }).then(pobierzStan);
    }

    function wybierzKarte(id) {
        fetch(`/api/etap3/wybierz?idKarty=${id}`, { method: 'POST' }).then(pobierzStan);
    }

    function zamknijPytanie() {
        fetch('/api/etap3/zamknij-pytanie', { method: 'POST' }).then(pobierzStan);
    }

    function uzyjKolo(druzyna) {
        fetch(`/api/etap3/kolo?druzyna=${druzyna}`, { method: 'POST' }).then(pobierzStan);
    }

    function odpowiedz(druzyna, poprawna) {
        fetch(`/api/etap3/odpowiedz?druzyna=${druzyna}&poprawna=${poprawna}`, { method: 'POST' }).then(pobierzStan);
    }

    document.addEventListener("DOMContentLoaded", pobierzStan);
    setInterval(pobierzStan, 2000);
</script>
</body>
</html>
