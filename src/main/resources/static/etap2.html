<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Teleturniej o Grach - Etap 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow-x: hidden; }

        body {
            font-family: 'Orbitron', sans-serif;
            background: radial-gradient(circle at center top, #231238 0%, #12091f 55%, #08030e 100%);
            background-attachment: fixed;
            color: #c5a1ff;
            padding: 20px;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
            background: linear-gradient(115deg, rgba(10, 30, 60, 0.95) 0%, rgba(12, 45, 80, 0.85) 30%, #0f172a 45%, #0f172a 55%, rgba(80, 15, 30, 0.85) 70%, rgba(60, 10, 25, 0.95) 100%);
            padding: 18px 25px;
            border-radius: 16px;
            border: 2px solid rgba(69, 243, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.05);
        }

        .team-container { width: 35%; display: flex; flex-direction: column; }
        .team-row-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255, 255, 255, 0.15); padding-bottom: 6px; }

        .team-blue .team-title { color: #58a6ff; font-size: 28px; font-weight: 900; margin: 0; text-transform: uppercase; text-shadow: 0 0 12px rgba(88, 166, 255, 0.4); }
        .team-red .team-title { color: #ff6b6b; font-size: 28px; font-weight: 900; margin: 0; text-transform: uppercase; text-shadow: 0 0 12px rgba(255, 107, 107, 0.4); }

        .score-wrapper { position: relative; }
        .score { font-size: 36px; font-weight: 900; color: #fff; }

        .score-float {
            position: absolute;
            top: -25px;
            font-size: 26px;
            font-weight: 900;
            animation: floatUpAndFade 1.4s ease-out forwards;
            pointer-events: none;
            z-index: 10;
        }
        .float-plus { color: #39ff14; text-shadow: 0 0 10px #39ff14; }
        .float-minus { color: #ff4d6d; text-shadow: 0 0 10px #ff4d6d; }

        @keyframes floatUpAndFade {
            0% { opacity: 0; transform: translateY(15px) scale(0.6); }
            30% { opacity: 1; transform: translateY(-5px) scale(1.3); }
            70% { opacity: 1; transform: translateY(-20px) scale(1.0); }
            100% { opacity: 0; transform: translateY(-35px) scale(0.8); }
        }

        .players-row { display: flex; gap: 15px; font-size: 15px; color: #66fcf1; list-style: none; padding: 6px 0 0 0; margin: 0; font-weight: 500; }
        .team-blue .players-row { justify-content: flex-start; }
        .team-red .players-row { justify-content: flex-end; }

        .center-titles { width: 28%; text-align: center; align-self: center; }
        .main-game-title { margin: 0; color: #fff; font-size: 24px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .sub-game-title { color: #66fcf1; font-size: 15px; margin-top: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 8px rgba(102,252,241,0.6); }

        .stage-container { margin-top: 30px; display: flex; flex-direction: column; align-items: center; }

        .numbers-nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; }

        .num-btn {
            width: 55px;
            height: 55px;
            font-size: 22px;
            font-weight: 900;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* KOLORY DLA STANÓW PYTAŃ 1-8 */
        /* W trakcie (DEFAULT) - Biały / Cyjan Glow */
        .num-btn.status-DEFAULT {
            background: rgba(22, 27, 34, 0.9);
            border: 2px solid #ffffff;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        }

        /* Nikt nie odpowiedział (NONE) - Szary */
        .num-btn.status-NONE {
            background: #222225;
            border: 2px solid #555555;
            color: #777777;
        }

        /* Niebiescy (BLUE) - Gradient Niebieski */
        .num-btn.status-BLUE {
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            border: 2px solid #00d2fc;
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 210, 252, 0.6);
        }

        /* Czerwoni (RED) - Gradient Czerwony */
        .num-btn.status-RED {
            background: linear-gradient(135deg, #b92b27, #1565c0); /* Subtelna czerwien/bordowy lub pelny czerwony */
            background: linear-gradient(135deg, #d31027, #ea384d);
            border: 2px solid #ff4e00;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 78, 0, 0.6);
        }

        /* Wybrane aktywne pytanie (efekt powiększenia i pulsu) */
        .num-btn.active {
            transform: scale(1.22);
            z-index: 5;
            border-width: 3px;
        }

        .gallery-container { display: flex; justify-content: center; gap: 30px; max-width: 1200px; margin: 0 auto; position: relative; }

        .img-card {
            width: 340px;
            height: 220px;
            background: rgba(22, 27, 34, 0.85);
            border: 2px solid #45f3ff;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 15px rgba(69, 243, 255, 0.2);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .img-card img { width: 100%; height: 100%; object-fit: cover; filter: blur(20px); transition: filter 0.5s ease, transform 0.3s ease; }
        .img-card.unblurred img { filter: blur(0px) !important; }

        .img-card.active-center {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(2.2);
            z-index: 1000;
            border-color: #ff007f;
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.9);
        }
        .img-card.active-center img { filter: blur(0px) !important; }

        .backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(8, 3, 14, 0.85);
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 999;
        }
        .backdrop.visible { opacity: 1; }
    </style>
</head>
<body>

<div class="backdrop" id="backdrop"></div>

<!-- NAGŁÓWEK HUD -->
<div class="header">
    <div class="team-container team-blue">
        <div class="team-row-top">
            <h2 id="viewDruzyna1" class="team-title">SZTYWNE GITY</h2>
            <div id="wrapperScore1" class="score-wrapper">
                <div id="viewPunkty1" class="score">0</div>
            </div>
        </div>
        <ul id="viewUczestnicy1" class="players-row"></ul>
    </div>

    <div class="center-titles">
        <h1 class="main-game-title">TELETURNIEJ O GRACH</h1>
        <div class="sub-game-title">Runda 2: Co to za gra?</div>
    </div>

    <div class="team-container team-red">
        <div class="team-row-top">
            <div id="wrapperScore2" class="score-wrapper">
                <div id="viewPunkty2" class="score">0</div>
            </div>
            <h2 id="viewDruzyna2" class="team-title">PATAŁACHY</h2>
        </div>
        <ul id="viewUczestnicy2" class="players-row"></ul>
    </div>
</div>

<!-- GLÓWNY SEKTOR KAFELKÓW ORAZ ONAWIGACJI -->
<div class="stage-container">
    <div class="numbers-nav" id="numbersNav"></div>

    <div class="gallery-container" id="galleryContainer">
        <div class="img-card" id="card-0"><img id="img-0" src="" alt=""></div>
        <div class="img-card" id="card-1"><img id="img-1" src="" alt=""></div>
        <div class="img-card" id="card-2"><img id="img-2" src="" alt=""></div>
    </div>
</div>

<script>
    let poprzedniePunkty1 = null;
    let poprzedniePunkty2 = null;

    function usunPływająceAnimacje(wrapperId) {
        const wrap = document.getElementById(wrapperId);
        const stary = wrap.querySelector('.score-float');
        if (stary) stary.remove();
    }

    function pokazAnimacjePunktow(wrapperId, roznica) {
        if (roznica === 0) return;
        usunPływająceAnimacje(wrapperId);

        const wrap = document.getElementById(wrapperId);
        const floatEl = document.createElement('div');
        floatEl.className = 'score-float ' + (roznica > 0 ? 'float-plus' : 'float-minus');
        floatEl.innerText = (roznica > 0 ? '+' : '') + roznica;

        wrap.appendChild(floatEl);

        setTimeout(() => {
            floatEl.remove();
        }, 1400);
    }

    function renderujStan(stan) {
        // Drużyna 1
        document.getElementById('viewDruzyna1').innerText = stan.nazwaDruzyny1;
        document.getElementById('viewUczestnicy1').innerHTML = stan.uczestniciDruzyny1.map(u => `<li>${u}</li>`).join('');
        if (poprzedniePunkty1 !== null && poprzedniePunkty1 !== stan.punktyDruzyny1) {
            pokazAnimacjePunktow('wrapperScore1', stan.punktyDruzyny1 - poprzedniePunkty1);
        }
        poprzedniePunkty1 = stan.punktyDruzyny1;
        document.getElementById('viewPunkty1').innerText = stan.punktyDruzyny1;

        // Drużyna 2
        document.getElementById('viewDruzyna2').innerText = stan.nazwaDruzyny2;
        document.getElementById('viewUczestnicy2').innerHTML = stan.uczestniciDruzyny2.map(u => `<li>${u}</li>`).join('');
        if (poprzedniePunkty2 !== null && poprzedniePunkty2 !== stan.punktyDruzyny2) {
            pokazAnimacjePunktow('wrapperScore2', stan.punktyDruzyny2 - npStan.punktyDruzyny2);
        }
        poprzedniePunkty2 = stan.punktyDruzyny2;
        document.getElementById('viewPunkty2').innerText = stan.punktyDruzyny2;

        // Nawigacja 1-8
        const nav = document.getElementById('numbersNav');
        nav.innerHTML = '';
        for (let i = 1; i <= 8; i++) {
            const pyt = stan.pytania[i - 1];
            const btn = document.createElement('div');

            let statusKlasa = `status-${pyt.stanWlasnosci || 'DEFAULT'}`;
            let activeKlasa = (stan.wybranePytanie === i) ? 'active' : '';

            btn.className = `num-btn ${statusKlasa} ${activeKlasa}`;
            btn.innerText = i;
            nav.appendChild(btn);
        }

        // Obsługa Galerii
        const aktualnePytanie = stan.pytania[stan.wybranePytanie - 1];
        const backdrop = document.getElementById('backdrop');
        let jestAktywny = false;

        aktualnePytanie.obrazki.forEach((imgData, index) => {
            const card = document.getElementById(`card-${index}`);
            const img = document.getElementById(`img-${index}`);

            img.src = imgData.url;

            if (imgData.odsloniety) {
                card.classList.add('unblurred');
            } else {
                card.classList.remove('unblurred');
            }

            if (stan.aktywnyObrazekId === imgData.id) {
                card.classList.add('active-center');
                jestAktywny = true;
            } else {
                card.classList.remove('active-center');
            }
        });

        if (jestAktywny) backdrop.classList.add('visible');
        else backdrop.classList.remove('visible');
    }

    // WebSockety
    const socket = new SockJS('/ws-quiz');
    const stompClient = Stomp.over(socket);
    stompClient.debug = null;

    stompClient.connect({}, function () {
        stompClient.subscribe('/topic/etap2', function (response) {
            renderujStan(JSON.parse(response.body));
        });
        fetch('/api/etap2/stan').then(res => res.json()).then(data => renderujStan(data));
    });

    document.addEventListener('contextmenu', event => event.preventDefault());
</script>
</body>
</html>
