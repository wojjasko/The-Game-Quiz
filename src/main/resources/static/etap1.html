<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Teleturniej o Grach - Ekran Główny</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background: radial-gradient(circle at center top, #231238 0%, #12091f 55%, #08030e 100%);
            background-attachment: fixed;
            color: #c5a1ff;
            padding: 20px;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
            background: linear-gradient(115deg,
            rgba(10, 30, 60, 0.95) 0%,
            rgba(12, 45, 80, 0.85) 30%,
            #0f172a 45%,
            #0f172a 55%,
            rgba(80, 15, 30, 0.85) 70%,
            rgba(60, 10, 25, 0.95) 100%
            );
            padding: 18px 25px;
            border-radius: 16px;
            border: 2px solid rgba(69, 243, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.05);
        }

        .team-container { width: 35%; display: flex; flex-direction: column; }
        .team-row-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255, 255, 255, 0.15); padding-bottom: 6px; }

        .team-blue .team-title {
            color: #58a6ff;
            font-size: 28px;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(88, 166, 255, 0.4);
        }
        .team-red .team-title {
            color: #ff6b6b;
            font-size: 28px;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 107, 107, 0.4);
        }

        .score-timer-wrapper { display: flex; gap: 12px; align-items: center; position: relative; }
        .score { font-size: 36px; font-weight: 900; color: #fff; position: relative; }

        .score-float {
            position: absolute;
            top: -25px;
            font-size: 26px;
            font-weight: 900;
            animation: floatUpAndFade 1.4s ease-out forwards;
            pointer-events: none;
            z-index: 10;
        }
        .float-plus { color: #39ff14; text-shadow: 0 0 10px #39ff14; }
        .float-minus { color: #ff4d6d; text-shadow: 0 0 10px #ff4d6d; }

        @keyframes floatUpAndFade {
            0% { opacity: 0; transform: translateY(15px) scale(0.6); }
            30% { opacity: 1; transform: translateY(-5px) scale(1.3); }
            70% { opacity: 1; transform: translateY(-20px) scale(1.0); }
            100% { opacity: 0; transform: translateY(-35px) scale(0.8); }
        }

        .steals-badge { font-size: 18px; color: #ffc107; text-shadow: 0 0 8px #ffc107; letter-spacing: 2px; }

        .timer-box {
            font-size: 20px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            background: #000;
            border: 1px solid #45f3ff;
            color: #45f3ff;
            box-shadow: 0 0 8px rgba(69, 243, 255, 0.2);
        }
        .timer-running { color: #ff0055; border-color: #ff0055; box-shadow: 0 0 12px rgba(255,0,85,0.6); }

        .players-row { display: flex; gap: 15px; font-size: 15px; color: #66fcf1; list-style: none; padding: 6px 0 0 0; margin: 0; font-weight: 500; }
        .team-blue .players-row { justify-content: flex-start; }
        .team-red .players-row { justify-content: flex-end; }

        .center-titles { width: 28%; text-align: center; align-self: center; }
        .main-game-title { margin: 0; color: #fff; font-size: 24px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .sub-game-title { color: #66fcf1; font-size: 15px; margin-top: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 8px rgba(102,252,241,0.6); }

        .main-container { display: flex; justify-content: center; gap: 35px; align-items: flex-start; margin-top: 15px; }

        /* Zintegrowana siatka 5-kolumnowa dla punktów i planszy gier */
        .board-grid {
            display: grid;
            grid-template-columns: 70px repeat(4, 115px);
            gap: 10px;
            align-items: center;
        }

        .category-item {
            width: 115px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 700;
            color: #fff;
            font-size: 14px;
            text-transform: uppercase;
            word-break: break-word;
            margin-bottom: 5px;
        }

        .point-label {
            font-size: 24px;
            font-weight: 700;
            color: #45f3ff;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            white-space: nowrap;
            text-shadow: 0 0 8px rgba(69,243,255,0.4);
            padding-right: 5px;
        }

        .cell {
            width: 115px;
            height: 115px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 22px;
            border-radius: 10px;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .DEFAULT { background-color: #161b22; border: 2px solid #45f3ff; color: #45f3ff; box-shadow: 0 0 8px rgba(69, 243, 255, 0.15); }
        .TEAM1_BLUE { background-color: #007bff; border: 2px solid #00d2fc; color: white; box-shadow: 0 0 10px rgba(0, 123, 255, 0.4); }
        .TEAM2_RED { background-color: #e43f5a; border: 2px solid #ff4e00; color: white; box-shadow: 0 0 10px rgba(228, 63, 90, 0.4); }
        .INCORRECT_GRAY { background-color: #333333; border: 2px solid #666666; color: #aaa; }
        .TEAM1_STEAL { background-color: #00b4d8; border: 2px dashed #fff; color: white; }
        .TEAM2_STEAL { background-color: #ff4d6d; border: 2px dashed #fff; color: white; }
        .SELECTED_WHITE { background-color: #ffffff; border: 2px solid #ffffff; color: #111; box-shadow: 0 0 18px #fff; }

        .winning-line {
            animation: lineGlow 0.6s infinite alternate;
            border: 3px solid #ffff00 !important;
            z-index: 5;
        }

        @keyframes lineGlow {
            from { box-shadow: 0 0 5px #ffff00, inset 0 0 5px #ffff00; transform: scale(1.0); }
            to { box-shadow: 0 0 25px #ffff00, inset 0 0 15px #ffff00; transform: scale(1.05); }
        }

        .question-box {
            width: 500px;
            background: rgba(22, 27, 34, 0.85);
            border: 2px solid #66fcf1;
            border-radius: 14px;
            padding: 22px;
            min-height: 310px;
            text-align: left;
            color: #fff;
            font-size: 19px;
            font-weight: 400;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.15);
            line-height: 1.5;
            backdrop-filter: blur(5px);
        }
        .question-title { color: #66fcf1; font-weight: bold; font-size: 18px; border-bottom: 1px solid rgba(102, 252, 241, 0.4); padding-bottom: 6px; margin-bottom: 15px; }
        .img-zoomed {
            max-height: 380px !important;
            transform: scale(1.05);
            box-shadow: 0 0 20px #00f5ff;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="team-container team-blue">
        <div class="team-row-top">
            <h2 id="viewDruzyna1" class="team-title">SZTYWNE GITY</h2>
            <div class="score-timer-wrapper">
                <div id="viewSteale1" class="steals-badge">⚡⚡</div>
                <div id="viewTimer1" class="timer-box">06:00</div>
                <div id="wrapperScore1" style="position: relative;">
                    <div id="viewPunkty1" class="score">0</div>
                </div>
            </div>
        </div>
        <ul id="viewUczestnicy1" class="players-row"></ul>
    </div>

    <div class="center-titles">
        <h1 class="main-game-title">TELETURNIEJ O GRACH</h1>
        <div class="sub-game-title">Runda 1: Matryca Pytań</div>
    </div>

    <div class="team-container team-red">
        <div class="team-row-top">
            <div class="score-timer-wrapper">
                <div id="wrapperScore2" style="position: relative;">
                    <div id="viewPunkty2" class="score">0</div>
                </div>
                <div id="viewTimer2" class="timer-box">06:00</div>
                <div id="viewSteale2" class="steals-badge">⚡⚡</div>
            </div>
            <h2 id="viewDruzyna2" class="team-title">PATAŁACHY</h2>
        </div>
        <ul id="viewUczestnicy2" class="players-row"></ul>
    </div>
</div>

<div class="main-container">
    <!-- Pojedyncza spójna siatka łącząca punkty, nagłówki oraz kafelki -->
    <div class="board-grid" id="boardGrid">
        <!-- Generowane dynamicznie w JS -->
    </div>

    <div class="question-box">
        <div class="question-title">AKTUALNE PYTANIE</div>
        <div id="viewPytanie">Oczekiwanie na uruchomienie pytania przez prowadzącego...</div>

        <div id="mediaContainer" style="margin-top: 15px; text-align: center;">
            <img id="viewObrazek" src=""
                 oncontextmenu="return false;"
                 ondragstart="return false;"
                 style="display: none; max-width: 100%; max-height: 200px; border-radius: 8px; border: 1px solid #45f3ff; margin-bottom: 10px; transition: all 0.3s ease; -webkit-user-select: none; user-select: none; pointer-events: none;">
            <audio id="viewAudio" controls controlsList="nodownload" oncontextmenu="return false;" style="display: none; width: 100%; margin-top: 10px;"></audio>
        </div>
    </div>
</div>

<script>
    let poprzedniePunkty1 = null;
    let poprzedniePunkty2 = null;
    let wygaszoneLinie = new Set();
    const wartosciPunktow = ["5 >", "10 >", "15 >", "20 >"];

    function formatCzas(sekundy) {
        const m = Math.floor(sekundy / 60).toString().padStart(2, '0');
        const s = (sekundy % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function usunPływająceAnimacje(wrapperId) {
        const wrap = document.getElementById(wrapperId);
        const stary = wrap.querySelector('.score-float');
        if (stary) stary.remove();
    }

    function pokazAnimacjePunktow(wrapperId, roznica) {
        if (roznica === 0) return;
        usunPływająceAnimacje(wrapperId);

        const wrap = document.getElementById(wrapperId);
        const floatEl = document.createElement('div');
        floatEl.className = 'score-float ' + (roznica > 0 ? 'float-plus' : 'float-minus');
        floatEl.innerText = (roznica > 0 ? '+' : '') + roznica;

        wrap.appendChild(floatEl);

        setTimeout(() => {
            floatEl.remove();
        }, 1400);
    }

    function renderujStan(stan) {
        const boardGrid = document.getElementById('boardGrid');
        boardGrid.innerHTML = '';

        // Wiersz 0: Puste miejsce nad punktami + 4 Nagłówki Kategorii
        const emptyCorner = document.createElement('div');
        boardGrid.appendChild(emptyCorner);

        stan.kategorie.forEach(cat => {
            const catDiv = document.createElement('div');
            catDiv.className = 'category-item';
            catDiv.innerText = cat;
            boardGrid.appendChild(catDiv);
        });

        // Wyznaczenie aktywnych wygrywających kafelków
        const aktywneKafelkiWRamce = new Set();
        if (stan.wygrywajaceLonie) {
            stan.wygrywajaceLonie.forEach(liniaStr => {
                if (!wygaszoneLinie.has(liniaStr)) {
                    const punkty = liniaStr.split('-');
                    punkty.forEach(p => aktywneKafelkiWRamce.add(p));

                    setTimeout(() => {
                        wygaszoneLinie.add(liniaStr);
                        renderujStan(stan);
                    }, 3000);
                }
            });
        }

        // Wiersze 1-4: Etykieta Punktów + 4 Kafelki wiersza
        for (let i = 0; i < 4; i++) {
            // Etykieta punktów dla danego wiersza
            const pointDiv = document.createElement('div');
            pointDiv.className = 'point-label';
            pointDiv.innerText = wartosciPunktow[i];
            boardGrid.appendChild(pointDiv);

            // 4 Kafelki
            for (let j = 0; j < 4; j++) {
                const cell = document.createElement('div');
                cell.id = `cell-${i}-${j}`;
                let klasa = `cell ${stan.plansza[i][j]}`;
                if (aktywneKafelkiWRamce.has(`${i},${j}`)) {
                    klasa += ' winning-line';
                }
                cell.className = klasa;
                boardGrid.appendChild(cell);
            }
        }

        // Reszta interfejsu (pytanie, drużyny, timer, punkty)
        document.getElementById('viewPytanie').innerText = stan.aktualnePytanie;

        document.getElementById('viewDruzyna1').innerText = stan.nazwaDruzyny1;
        document.getElementById('viewUczestnicy1').innerHTML = stan.uczestnicyDruzyny1.map(u => `<li>${u}</li>`).join('');
        document.getElementById('viewSteale1').innerText = '⚡'.repeat(stan.stealeDruzyna1);

        if (poprzedniePunkty1 !== null && poprzedniePunkty1 !== stan.punktyDruzyny1) {
            pokazAnimacjePunktow('wrapperScore1', stan.punktyDruzyny1 - poprzedniePunkty1);
        }
        poprzedniePunkty1 = stan.punktyDruzyny1;
        document.getElementById('viewPunkty1').innerText = stan.punktyDruzyny1;

        const t1 = document.getElementById('viewTimer1');
        t1.innerText = formatCzas(stan.czasDruzyny1);
        if (stan.czasDruzyny1Running) t1.classList.add('timer-running');
        else t1.classList.remove('timer-running');

        document.getElementById('viewDruzyna2').innerText = stan.nazwaDruzyny2;
        document.getElementById('viewUczestnicy2').innerHTML = stan.uczestnicyDruzyny2.map(u => `<li>${u}</li>`).join('');
        document.getElementById('viewSteale2').innerText = '⚡'.repeat(stan.stealeDruzyna2);

        if (poprzedniePunkty2 !== null && poprzedniePunkty2 !== stan.punktyDruzyny2) {
            pokazAnimacjePunktow('wrapperScore2', stan.punktyDruzyny2 - poprzedniePunkty2);
        }
        poprzedniePunkty2 = stan.punktyDruzyny2;
        document.getElementById('viewPunkty2').innerText = stan.punktyDruzyny2;

        const t2 = document.getElementById('viewTimer2');
        t2.innerText = formatCzas(stan.czasDruzyny2);
        if (stan.czasDruzyny2Running) t2.classList.add('timer-running');
        else t2.classList.remove('timer-running');

        const imgEl = document.getElementById('viewObrazek');
        if (stan.obrazekUrl) {
            imgEl.src = stan.obrazekUrl;
            imgEl.style.display = 'inline-block';
            if (stan.obrazekPowiekszony) {
                imgEl.classList.add('img-zoomed');
            } else {
                imgEl.classList.remove('img-zoomed');
            }
        } else {
            imgEl.style.display = 'none';
            imgEl.src = '';
        }

        const audioEl = document.getElementById('viewAudio');
        if (stan.dzwiekUrl) {
            if (audioEl.src !== window.location.origin + stan.dzwiekUrl) {
                audioEl.src = stan.dzwiekUrl;
            }
            audioEl.style.display = 'block';
        } else {
            audioEl.style.display = 'none';
            audioEl.src = '';
        }
    }

    const socket = new SockJS('/ws-quiz');
    const stompClient = Stomp.over(socket);
    stompClient.debug = null;

    stompClient.connect({}, function () {
        stompClient.subscribe('/topic/plansza', function (response) {
            renderujStan(JSON.parse(response.body));
        });
        fetch('/api/plansza').then(res => res.json()).then(data => renderujStan(data));
    });

    document.addEventListener('contextmenu', event => event.preventDefault());
</script>
</body>
</html>
