# --- GIERECZKOWO settings -------------------------------------------------------------------------------------
server.port=8080
server.compression.enabled=true

# Creating a game (and closing it without the host token) requires this code. Entered on the start page.
# Leave empty to let anybody create a game.
quiz.access-code=WOJTUSIELEK
# Directory with images/stage1, images/stage2 and sounds (relative to the working directory).
quiz.media-dir=./media
# Directory with the editable question bank (stage1-categories.json, stage2-questions.json, stage3-cards.json).
quiz.data-dir=./data
quiz.game-idle-timeout-minutes=360
quiz.max-players-per-team=8
# Allowed origins of WebSocket handshakes; narrow this when the app is exposed publicly.
quiz.allowed-origins=*
